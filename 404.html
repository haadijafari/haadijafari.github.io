<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b0b0f" />
  <title>Page not found | Hadi Jafari</title>

  <!-- Root-absolute paths: GitHub Pages serves this page at whatever URL was missing -->
  <link rel="icon" href="/images/favicon/favicon.ico" sizes="any" />
  <link rel="preload" href="/fonts/pinyon-script.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/base.css" />
  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--shell-pad);
      text-align: center;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-family: var(--font-script);
      font-size: clamp(3rem, 2rem + 5vw, 5rem);
      font-weight: 400;
    }

    p {
      margin: 0 0 2rem;
      color: var(--c-muted);
    }
  </style>
</head>

<body>
  <main>
    <h1>Page not found</h1>
    <p>The page you were looking for doesn't exist or has moved.</p>
    <a class="btn-primary-pill" href="/">Back to hadij.ir</a>
  </main>
</body>

</html>
