<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden}iframe{border:0;display:block}</style></head>
<body>
<script>
  // Screenshot harness for tools/screens.sh: /tools/frame.html?w=390&h=844&a=about[&o=px][&c=selector][&f=selector]
  var q = new URLSearchParams(location.search);
  var f = document.createElement("iframe");
  f.width = q.get("w"); f.height = q.get("h");
  f.onload = function () {
    var d = f.contentDocument;
    d.documentElement.style.scrollBehavior = "auto";
    var el = q.get("a") && d.getElementById(q.get("a"));
    // Load lazy images now: copies in this document hold the capture until they arrive.
    d.querySelectorAll('img[loading="lazy"]').forEach(function (img) {
      img.loading = "eager";
      var copy = document.createElement("img");
      copy.src = img.currentSrc || img.src;
      copy.style.cssText = "position:absolute;width:1px;height:1px;opacity:0";
      document.body.appendChild(copy);
    });
    // c=<selector>: click it (e.g. to open the lightbox) before the capture
    if (q.get("c")) d.querySelector(q.get("c")).click();
    // f=<selector>: keyboard-focus it before the capture
    if (q.get("f")) { f.contentWindow.focus(); d.querySelector(q.get("f")).focus({ focusVisible: true }); }
    // Horizontal overflow shows up as a red banner across the capture.
    if (d.documentElement.scrollWidth > d.documentElement.clientWidth) {
      var b = document.createElement("div");
      b.textContent = "OVERFLOW: page is " + d.documentElement.scrollWidth + "px wide";
      b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9;background:red;color:#fff;font:bold 16px sans-serif;padding:8px";
      document.body.appendChild(b);
    }
    if (el) f.contentWindow.scrollTo(0, el.getBoundingClientRect().top + f.contentWindow.scrollY + (+q.get("o") || 0));
  };
  f.src = q.get("p") || "/";  // p=<path>: another page (used to self-test the overflow banner)
  document.body.appendChild(f);
</script>
</body></html>
